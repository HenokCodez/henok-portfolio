<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin drawer — layout mockup</title><link rel="stylesheet" href="mock.css"></head>
<body style="height:960px;overflow:hidden"><div class="adm"><aside class="side" data-n="1"><div class="logo" style="padding:8px 14px 24px"><b>HENOK</b><span>Admin</span></div><div class="nv on"><i></i>Videos</div><div class="nv "><i></i>Messages<em>3</em></div><div class="nv "><i></i>Settings</div><div style="flex:1"></div><div class="nv"><i></i>View site ↗</div><div class="nv"><i></i>Sign out</div></aside><main class="main"><div class="top"><h1>Videos</h1></div><div class="tbl" style="opacity:.35;height:760px"></div></main></div>
<div class="scrim"></div>
<div class="drawer" data-n="2">
 <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.04em;text-transform:uppercase">Add video</h2><a class="btn sm">✕</a></div>
 <div class="field" data-n="3"><label>YouTube URL or ID</label><div class="input box focus">https://youtu.be/aqz-KE-bpKQ</div></div>
 <div class="th g2" style="border-radius:12px;aspect-ratio:16/8" data-n="4"><div class="fig"></div><div class="play sm"></div><span class="tc">PREVIEW — ID DETECTED ✓</span></div>
 <div class="field" data-n="5"><label>Title</label><div class="input box">The Last Harvest</div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px" data-n="6"><div class="field"><label>Category</label><div class="input box">Documentary ▾</div></div><div class="field"><label>Year</label><div class="input box">2025</div></div>
 <div class="field"><label>Client</label><div class="input box">Independent</div></div><div class="field"><label>Role</label><div class="input box">Editor, Colour</div></div></div>
 <div class="field"><label>Description</label><div class="input box area">A short documentary following…</div></div>
 <div style="display:flex;gap:28px;align-items:center" data-n="7"><span style="display:flex;gap:10px;align-items:center"><span class="sw on"></span>Published</span><span style="display:flex;gap:10px;align-items:center"><span class="sw on"></span>Featured</span></div>
 <div style="flex:1"></div>
 <div style="display:flex;justify-content:space-between" data-n="8"><a class="btn sm" style="color:var(--danger);border-color:rgba(255,90,95,.4)">Delete</a><div style="display:flex;gap:10px"><a class="btn">Cancel</a><a class="btn acc">Save video</a></div></div>
</div></body></html>
