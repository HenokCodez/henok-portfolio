<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin login — layout mockup</title><link rel="stylesheet" href="mock.css"></head>
<body><div class="login"><div class="card-s" data-n="1">
<div class="logo"><b style="font-size:26px">HENOK</b><span>Admin</span></div>
<div><h1 style="font-family:var(--font-display);font-weight:800;font-size:34px;letter-spacing:-.04em;text-transform:uppercase;line-height:1">Sign in</h1><p class="muted" style="font-size:14px;margin-top:8px">Private area. Authorised access only.</p></div>
<div class="field" data-n="2"><label>Email</label><div class="input box ph-t">you@email.com</div></div>
<div class="field" data-n="3"><label>Password</label><div class="input box focus">••••••••••</div></div>
<div data-n="4" style="color:var(--danger);font-size:13px;display:flex;gap:8px;align-items:center">● Invalid email or password.</div>
<a class="btn acc lg" style="justify-content:center" data-n="5">Sign in</a>
<a class="mono" style="text-align:center">← Back to site</a></div></div></body></html>
